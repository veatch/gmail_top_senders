[project]
name = "gmail-sender-analytics"
version = "0.1.0"
description = "Read-only Gmail metadata sync to SQLite and top-sender reports"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "google-api-python-client==2.52.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==0.5.3",
    "google-auth==1.35.0",
]

[project.scripts]
gmail-top-senders = "gmail_top_senders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_top_senders"]
