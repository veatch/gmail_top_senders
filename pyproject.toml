[project]
name = "mail-room"
version = "0.1.0"
description = "Small, read-only tool to download Gmail inbox metadata and show messages and senders taking up the most room"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "flask>=2.2.5",
    "google-api-python-client==2.52.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==0.5.3",
    "google-auth==1.35.0",
]

[project.scripts]
mail-room = "mail_room.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_room"]
